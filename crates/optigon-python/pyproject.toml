# PyPI packaging for the `optigon` Python extension (PyO3 + maturin). Build/
# install locally with `maturin develop --release`; wheels come from a maturin
# CI matrix (abi3 → one wheel per platform across CPython >= 3.8).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "optigon"
description = "Optigon — the many-faceted optimizer, as a Python native extension."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Collin Kokotas" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "optigon"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
strip = true
