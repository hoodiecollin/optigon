# PyPI packaging for the `optigon` Python extension (PyO3 + maturin). Build/
# install locally with `maturin develop --release`; wheels come from a maturin
# CI matrix (abi3 → one wheel per platform across CPython >= 3.8).
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "optigon"
description = "Optigon — the many-faceted optimizer, as a Python native extension."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Collin Kokotas" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
keywords = ["adaptive-dispatch", "algorithm-selection", "autotuning", "regret", "rust"]
# `version` is absent from [project] on purpose: maturin resolves it from the
# crate's Cargo.toml when it is declared dynamic, which keeps the wheel on the
# same lockstep version line as the crates (see the ledger on issue #26).
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/hoodiecollin/optigon"
Repository = "https://github.com/hoodiecollin/optigon"
Issues = "https://github.com/hoodiecollin/optigon/issues"

[tool.maturin]
module-name = "optigon"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
strip = true
