[package]
name = "optigon-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Optigon native addon for Node.js and Bun (napi-rs). A thin 1:1 wrapper over optigon-core — no logic of its own."

[lib]
# The Node-API addon. One .node serves both Node and Bun (both implement Node-API).
crate-type = ["cdylib"]

[dependencies]
optigon-core = { path = "../optigon-core" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
